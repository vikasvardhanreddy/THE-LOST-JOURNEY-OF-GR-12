name: Build THE LOST JOURNEY Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Test and export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Install Godot editor and matching Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/editor.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          GODOT_BIN="$RUNNER_TEMP/godot/editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_DIR="$(dirname "$(find "$RUNNER_TEMP/godot/templates" -type f -name android_debug.apk -print -quit)")"
          test -f "$TEMPLATE_DIR/android_release.apk"
          cp -a "$TEMPLATE_DIR/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project and run game checks
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import --quit
          "$GODOT_BIN" --headless --path . --script tools/quality_check_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script tools/chapter_selection_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script tools/audio_smoke_test.gd
          "$GODOT_BIN" --headless --path . --script tools/mobile_controls_smoke_test.gd

      - name: Export signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-debug Android build/android/TheLostJourney-debug.apk
          test -s build/android/TheLostJourney-debug.apk

      - name: Verify package ID and landscape orientation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/TheLostJourney-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$AAPT" dump badging "$APK" | grep -F "name='com.mygamestudio.thelostjourney'"
          "$APKANALYZER" manifest print "$APK" > build/android/AndroidManifest.xml
          grep -E 'screenOrientation="landscape"|screenOrientation="sensorLandscape"' build/android/AndroidManifest.xml

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: TheLostJourney-Android-Debug
          path: build/android/TheLostJourney-debug.apk
          if-no-files-found: error
          retention-days: 14
